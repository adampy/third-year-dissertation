# Make deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: limbo
  labels:
    app: limbo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: limbo
  template:
    metadata:
      labels:
        app: limbo
    spec:
      containers:
      - name: proactive-pod-autoscaler
        image: adamc1234/proactive-pod-autoscaler:limbo
        imagePullPolicy: Always
      imagePullSecrets:
      - name: regcred
