apiVersion: custompodautoscaler.com/v1
kind: CustomPodAutoscaler
metadata:
  name: proactive-pod-autoscaler-teastore-webui
spec:
  template:
    spec:
      containers:
      - name: proactive-pod-autoscaler
        image: adamc1234/proactive-pod-autoscaler:latest
        imagePullPolicy: Always
        env:
        - name: INFERENCE_URL
          value: ${INFERENCE_URL}
      imagePullSecrets: # https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/#create-a-pod-that-uses-your-secret and https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/#inspecting-the-secret-regcred
      - name: regcred
  scaleTargetRef:
    apiVersion: apps/v1
    kind: ReplicaSet
    name: ${WEBUI_REPLICASET_NAME} # This is substituted in through envsubst (in ./setup.sh)
  roleRequiresMetricsServer: true
  config:
    - name: interval
      value: "10000"