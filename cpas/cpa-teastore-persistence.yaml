apiVersion: custompodautoscaler.com/v1
kind: CustomPodAutoscaler
metadata:
  name: proactive-pod-autoscaler-teastore-persistence
spec:
  template:
    spec:
      containers:
      - name: proactive-pod-autoscaler
        image: proactive-pod-autoscaler:latest
        imagePullPolicy: IfNotPresent
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: teastore-persistence
  roleRequiresMetricsServer: true
  config:
    - name: interval
      value: "10000"