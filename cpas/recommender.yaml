apiVersion: custompodautoscaler.com/v1
kind: CustomPodAutoscaler
metadata:
  name: proactive-pod-autoscaler-teastore-recommender
spec:
  template:
    spec:
      containers:
      - name: proactive-pod-autoscaler
        image: adamc1234/proactive-pod-autoscaler:latest
        imagePullPolicy: Always
        env:
        - name: INFERENCE_URL
          value: ${INFERENCE_URL}
      imagePullSecrets:
      - name: regcred
  scaleTargetRef:
    apiVersion: apps/v1
    kind: ReplicaSet
    name: ${RECOMMENDER_REPLICASET_NAME}
  roleRequiresMetricsServer: true
  config:
    - name: interval
      value: "10000"