apiVersion: custompodautoscaler.com/v1autoscaler
kind: CustomPodAutoscaler
metadata:
  name: proactive-pod-autoscaler-teastore-auth
spec:
  template:
    spec:
      containers:
      - name: proactive-pod-autoscaler
        image: adamc1234/proactive-pod-autoscaler:latest
        imagePullPolicy: Always
      imagePullSecrets:
      - name: regcred
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: teastore-auth
  roleRequiresMetricsServer: true
  config:
    - name: interval
      value: "10000"
---
